<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITS College ERP - Secure Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glow-effect {
            box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.3);
        }
        .animated-bg {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: pulse 8s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1) translate(0px, 0px); }
            50% { transform: scale(1.1) translate(20px, -20px); }
            100% { transform: scale(1) translate(0px, 0px); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-slate-100">

    <!-- Ambient Background Lighting Orbs -->
    <div class="animated-bg w-96 h-96 bg-indigo-600/30 -top-10 -left-10"></div>
    <div class="animated-bg w-96 h-96 bg-purple-600/30 -bottom-10 -right-10" style="animation-delay: -4s;"></div>

    <!-- Main Container -->
    <div class="w-full max-w-md z-10">
        
        <!-- Glassmorphism Login Card -->
        <div class="glass-card glow-effect rounded-3xl p-8 sm:p-10 shadow-2xl relative overflow-hidden">
            
            <!-- Top Gradient Line -->
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500"></div>

            <!-- Header / Logo Section -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 shadow-lg mb-4 text-white text-2xl font-bold">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">
                    ITS College ERP[cite: 9]
                </h1>
                <p class="text-xs text-indigo-300 font-medium tracking-wide uppercase mt-1">
                    Greater Noida, Uttar Pradesh[cite: 9]
                </p>
            </div>

            <!-- Messages Alert Box (Django Dynamic Messages) -->
            {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for message in messages %}
                        <div class="p-3.5 rounded-xl text-sm font-medium flex items-center gap-3 bg-red-500/20 border border-red-500/30 text-red-200">
                            <i class="fa-solid fa-triangle-exclamation text-red-400"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <!-- Form -->
            <form method="POST" action="" class="space-y-5">
                {% csrf_token %}
                
                <!-- Username Field -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2" for="username">
                        Username[cite: 9]
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-user text-sm"></i>
                        </div>
                        <input type="text" name="username" id="username" required
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-900/50 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/80 focus:border-transparent transition duration-200 shadow-inner"
                            placeholder="Enter your username">
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider" for="password">
                            Password[cite: 9]
                        </label>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input type="password" name="password" id="password" required
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-900/50 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/80 focus:border-transparent transition duration-200 shadow-inner"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Remember / Forgot Row -->
                <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
                    <label class="flex items-center gap-2 cursor-pointer hover:text-slate-300 transition">
                        <input type="checkbox" class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="text-indigo-400 hover:text-indigo-300 font-medium transition">Forgot Password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:from-indigo-600 hover:via-purple-600 hover:to-pink-600 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-900 transition-all duration-300 transform active:scale-[0.98]">
                    <span class="flex items-center justify-center gap-2">
                        <span>Secure Login</span>[cite: 9]
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </span>
                </button>
            </form>

            <!-- Footer Note -->
            <div class="mt-8 pt-6 border-t border-slate-700/50 text-center text-xs text-slate-400">
                <p>© 2026 ITS College ERP. All rights reserved.</p>
            </div>

        </div>
    </div>

</body>
</html>
