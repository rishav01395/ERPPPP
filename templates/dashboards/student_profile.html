{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile | ITS College ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-2xl w-full bg-[#111827] border border-slate-800 rounded-3xl p-8 shadow-2xl">
        <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-xl font-bold text-white"><i class="fa-solid fa-user-pen text-purple-500 mr-2"></i> Complete Your Profile</h1>
                <p class="text-xs text-slate-400 mt-1">Fill in your academic and personal details for admin verification.</p>
            </div>
            <a href="{% url 'student_dashboard' %}" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back
            </a>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {% for field in form %}
                <div class="{% if field.name == 'address' %}sm:col-span-2{% endif %}">
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-400 text-xs mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-purple-900/40 transition">
                    Save & Update Profile
                </button>
            </div>
        </form>
    </div>
</body>
</html>
